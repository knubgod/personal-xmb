<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Security-Policy"
        content="
            default-src 'self';
            base-uri 'none';
            object-src 'none';
            form-action 'none';
            script-src 'self' https://sdk.scdn.co;
            style-src 'self';
            img-src 'self' data: xmb-artwork: https://i.scdn.co https://*.spotifycdn.com https://*.scdn.co https://steamcdn-a.akamaihd.net https://cdn.akamai.steamstatic.com;
            media-src 'self' blob: https://*.spotifycdn.com https://*.scdn.co;
            font-src 'self';
            connect-src 'self' https://api.spotify.com https://accounts.spotify.com https://sdk.scdn.co https://*.spotify.com https://*.scdn.co wss://*.spotify.com;
            frame-src 'self' https://sdk.scdn.co;
        "
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal XMB</title>


    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        rel="stylesheet"
        href="css/xmb.css"
    >

    <link rel="stylesheet" href="css/settings-branch.css">
    <link rel="stylesheet" href="../services/friends.css">
    <link rel="stylesheet" href="../services/spotify.css">

    <link
        rel="stylesheet"
        href="css/animations.css"
    >

</head>


<body>

    <!--
        ====================================================
        STARTUP ANIMATION
        ====================================================

        This gives Personal XMB a short PS3-inspired
        startup moment.

        The XMB itself is already underneath this layer,
        so the application can begin loading immediately
        while the animation plays.
    -->

    <div
        id="xmb-startup"
        aria-hidden="true"
    >

        <div id="startup-glow"></div>

        <div id="startup-mark">
            <span class="startup-mark-main">XMB</span>
            <span class="startup-mark-sub">FOR PC</span>
        </div>

        <div id="startup-title">
            PERSONAL XMB
        </div>

    </div>


    <!--
        ====================================================
        BACKGROUND
        ====================================================
    -->

    <div id="background">

        <div id="background-artwork">

            <img
                id="background-artwork-image"
                alt=""
            >

        </div>


        <div id="background-glow"></div>


        <!--
            Central coded XMB ribbon system.
        -->

        <svg
            id="wave-system"
            viewBox="0 0 1600 900"
            preserveAspectRatio="none"
        >

                    L1720 320

                    C350 850 150 710 -120 790

            ></path>


            <!--
                =================================================
                XMB SPARKLES
                =================================================
            -->

                ></circle>

                <circle

                ></circle>

            </g>

        </svg>


        <div id="particles"></div>

    </div>


    <!--
        ====================================================
        TOP BAR
        ====================================================
    -->

    <header id="top-bar">

        <div id="category-viewport">

            <div id="categories"></div>

        </div>


        <div id="clock"></div>

    </header>


    <!--
        ====================================================
        MAIN XMB
        ====================================================
    -->

    <main id="xmb-main">


        <!--
            =================================================
            CATEGORY INFORMATION
            =================================================
        -->

        <section
            id="category-heading"
        >

            <div
                id="selected-category"
            ></div>

            <div
                id="category-description"
            ></div>

        </section>


        <!--
            =================================================
            SELECTED ITEM PREVIEW
            =================================================
        -->

        <section id="selection-preview">

            <div id="selection-artwork">

                <img
                    id="selection-artwork-image"
                    alt=""
                >

            </div>

            <div id="selection-platform"></div>

            <div id="selection-title"></div>

            <div id="selection-description"></div>

            <div id="selection-status"></div>

        </section>


        <!--
            =================================================
            VERTICAL LAUNCHER
            =================================================
        -->

        <section
            id="item-area"
        >

            <div id="items"></div>

        </section>


        <!--
            =================================================
            OPTIONS MENU
            =================================================
        -->

        <section
            id="action-area"
        >

            <div
                id="action-title"
            >
                OPTIONS
            </div>

            <div id="actions"></div>

        </section>


        <!--
            =================================================
            SPOTIFY / MEDIA PLAYER
            =================================================
        -->

        <section
            id="media-player"
        >

            <div id="media-artwork">

                <img
                    id="media-artwork-image"
                    alt=""
                >

            </div>


            <div id="media-info">

                <div id="media-label">
                    NOW PLAYING
                </div>

                <div id="media-title">
                    Nothing playing
                </div>

                <div id="media-artist">
                    No active media
                </div>


                <div id="media-progress">

                    <div
                        id="media-progress-track"
                    >

                        <div
                            id="media-progress-fill"
                        ></div>

                    </div>

                </div>


                <div id="media-times">

                    <span id="media-current">
                        0:00
                    </span>

                    <span id="media-duration">
                        0:00
                    </span>

                </div>


                <div id="media-controls">

                    <button id="media-shuffle" type="button" title="Shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3c3.5 0 4.5 10 8 10h3"></path><path d="M17 14l3 3-3 3"></path><path d="M3 17h3c1.2 0 2.2-1.1 3-2.5"></path><path d="M15 7h2c1.2 0 2.2 1.1 3 2.5"></path><path d="M17 4l3 3-3 3"></path></svg></button>

                    <button id="media-repeat" type="button" title="Repeat" aria-label="Repeat off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 6h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 18H7"></path></svg></button>

                    <button
                        id="media-previous"
                        type="button"
                    >
                        ◀
                    </button>

                    <button
                        id="media-play"
                        type="button"
                    >
                        ▶
                    </button>

                    <button
                        id="media-next"
                        type="button"
                    >
                        ▶
                    </button>

                </div>

            </div>

        </section>


    </main>


    <!--
        ====================================================
        TEMPORARY MESSAGE
        ====================================================
    -->

    <div
        id="temporary-message"
    ></div>


    <!--
        ====================================================
        BOTTOM CONTROLS
        ====================================================
    -->

    <footer id="bottom-bar">

        <div id="input-mode">
            KEYBOARD
        </div>


        <div
            id="control-hints"
        >

            <div id="back-hint">

                <span
                    id="back-button"
                    class="input-button"
                >
                    ESC
                </span>

                <span id="back-label">
                    Back
                </span>

            </div>


            <div id="options-hint">

                <span
                    id="options-button"
                    class="input-button"
                >
                    O
                </span>

                <span id="options-label">
                    Options
                </span>

            </div>


            <div
                id="friends-platform-hint"
                aria-hidden="true"
            >
                <span class="input-button">LB</span>
                <span class="friends-platform-hint-arrow">/</span>
                <span class="input-button">RB</span>
                <span>Platforms</span>
            </div>

            <div
                id="spotify-controller-hint"
                aria-hidden="true"
            >
                <span class="input-button">LB+RB</span>
                <span>Media</span>
            </div>

            <div id="select-hint">

                <span
                    id="select-button"
                    class="input-button"
                >
                    ENTER
                </span>

                <span id="select-label">
                    Select
                </span>

            </div>

        </div>

    </footer>


    <!--
        ====================================================
        JAVASCRIPT
        ====================================================
    -->

    <script src="components/categoryBar.js"></script>

    <script src="components/itemList.js"></script>

    <script src="components/statusPanel.js"></script>


    <!-- Existing services -->

    <script src="../services/steam.js"></script>

    <script src="../services/riot.js"></script>

    <script src="../services/spotify.js"></script>

    <script src="js/spotify-sdk.js"></script>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>

    <script src="../services/server.js"></script>


    <!-- Metadata -->

    <script src="../services/metadata.js"></script>

    <script src="../services/steamMetadata.js"></script>

    <script src="../services/steamArtwork.js"></script>

    <script src="../services/artwork.js"></script>


    <!-- XMB logic -->

    <script src="js/navigation.js"></script>

    <script src="js/controller.js"></script>

    <script src="js/audio.js"></script>

    <script src="js/settings.js"></script>

    <script src="js/renderer.js"></script>

    <script src="js/clock.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
