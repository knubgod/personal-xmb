<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Security-Policy"
        content="
            default-src 'self';
            base-uri 'none';
            object-src 'none';
            form-action 'none';
            script-src 'self';
            style-src 'self';
            img-src 'self' data: xmb-artwork: https://i.scdn.co https://*.spotifycdn.com https://mosaic.scdn.co https://steamcdn-a.akamaihd.net https://cdn.akamai.steamstatic.com https://avatars.akamai.steamstatic.com;
            media-src 'self' blob: https://*.spotifycdn.com;
            font-src 'self';
            connect-src 'self' https://api.spotify.com https://accounts.spotify.com https://*.spotify.com;
            frame-src 'self';
        "
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal XMB</title>


    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        rel="stylesheet"
        href="css/xmb.css"
    >

    <link rel="stylesheet" href="css/settings-branch.css">
    <link rel="stylesheet" href="../services/friends.css">
    <link rel="stylesheet" href="../services/spotify.css">

    <link
        rel="stylesheet"
        href="css/animations.css"
    >

</head>


<body>

    <!--
        ====================================================
        STARTUP ANIMATION
        ====================================================

        This gives Personal XMB a short PS3-inspired
        startup moment.

        The XMB itself is already underneath this layer,
        so the application can begin loading immediately
        while the animation plays.
    -->

    <div
        id="xmb-startup"
        aria-hidden="true"
    >

        <div id="startup-glow"></div>

        <div id="startup-mark">
            <span class="startup-mark-main">XMB</span>
            <span class="startup-mark-sub">FOR PC</span>
        </div>

        <div id="startup-title">
            PERSONAL XMB
        </div>

    </div>


    <!--
        ====================================================
        BACKGROUND
        ====================================================
    -->

    <div id="background">

        <div id="background-artwork">

            <img
                id="background-artwork-image"
                alt=""
            >

        </div>


        <div id="background-glow"></div>


        <!--
            Central coded XMB ribbon system.
        -->

        <svg
            id="wave-system"
            viewBox="0 0 1600 900"
            preserveAspectRatio="none"
        >

            <defs>

                <linearGradient
                    id="xmb-wave-front"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0"
                >
                    <stop offset="0%" stop-color="#0c132b" stop-opacity="0.78"></stop>
                    <stop offset="48%" stop-color="#25345f" stop-opacity="0.52"></stop>
                    <stop offset="100%" stop-color="#5268a8" stop-opacity="0.20"></stop>
                </linearGradient>

                <linearGradient
                    id="xmb-wave-mid"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0"
                >
                    <stop offset="0%" stop-color="#070c1b" stop-opacity="0.68"></stop>
                    <stop offset="55%" stop-color="#1b2850" stop-opacity="0.46"></stop>
                    <stop offset="100%" stop-color="#7187c5" stop-opacity="0.16"></stop>
                </linearGradient>

                <linearGradient
                    id="xmb-wave-back"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0"
                >
                    <stop offset="0%" stop-color="#050914" stop-opacity="0.62"></stop>
                    <stop offset="100%" stop-color="#43578f" stop-opacity="0.13"></stop>
                </linearGradient>

                <filter
                    id="xmb-wave-soft"
                    x="-10%"
                    y="-20%"
                    width="120%"
                    height="140%"
                >
                    <feGaussianBlur stdDeviation="0.8"></feGaussianBlur>
                </filter>

            </defs>

            <!--
                PS3-inspired background ribbon system.

                The bands are deliberately thinner and more separated
                than the old heavy black waves. Their curves share the
                same broad motion but stagger vertically, creating the
                soft layered ribbon effect without competing with the UI.
            -->

            <path
                id="wave4"
                fill="url(#xmb-wave-back)"
                d="
                    M-140 760
                    C130 650 330 820 590 700
                    C835 590 1010 465 1240 545
                    C1440 615 1540 575 1740 465
                    L1740 487
                    C1540 597 1440 637 1240 567
                    C1010 487 835 612 590 722
                    C330 842 130 672 -140 782
                    Z
                "
            ></path>

            <path
                id="wave3"
                fill="url(#xmb-wave-back)"
                d="
                    M-140 675
                    C130 565 330 735 590 615
                    C835 505 1010 380 1240 460
                    C1440 530 1540 490 1740 380
                    L1740 404
                    C1540 514 1440 554 1240 484
                    C1010 404 835 529 590 639
                    C330 759 130 589 -140 699
                    Z
                "
            ></path>

            <path
                id="wave2"
                fill="url(#xmb-wave-mid)"
                d="
                    M-140 590
                    C130 480 330 650 590 530
                    C835 420 1010 295 1240 375
                    C1440 445 1540 405 1740 295
                    L1740 321
                    C1540 431 1440 471 1240 401
                    C1010 321 835 446 590 556
                    C330 676 130 506 -140 616
                    Z
                "
            ></path>

            <path
                id="wave1"
                fill="url(#xmb-wave-front)"
                d="
                    M-140 505
                    C130 395 330 565 590 445
                    C835 335 1010 210 1240 290
                    C1440 360 1540 320 1740 210
                    L1740 239
                    C1540 349 1440 389 1240 319
                    C1010 239 835 364 590 474
                    C330 594 130 424 -140 534
                    Z
                "
            ></path>

            <!-- A very soft secondary edge keeps the ribbons from
                 looking like flat geometric bars. -->
            <path
                fill="none"
                stroke="rgba(118,140,205,0.10)"
                stroke-width="3"
                filter="url(#xmb-wave-soft)"
                d="
                    M-120 520
                    C145 410 335 580 600 460
                    C845 350 1015 225 1245 305
                    C1440 373 1545 335 1720 235
                "
            ></path>

        </svg>


        <div id="particles"></div>

    </div>


    <!--
        ====================================================
        TOP BAR
        ====================================================
    -->

    <header id="top-bar">

        <div id="category-viewport">

            <div id="categories"></div>

        </div>


        <div id="clock"></div>

    </header>


    <!--
        ====================================================
        MAIN XMB
        ====================================================
    -->

    <main id="xmb-main">


        <!--
            =================================================
            CATEGORY INFORMATION
            =================================================
        -->

        <section
            id="category-heading"
        >

            <div
                id="selected-category"
            ></div>

            <div
                id="category-description"
            ></div>

        </section>


        <!--
            =================================================
            SELECTED ITEM PREVIEW
            =================================================
        -->

        <section id="selection-preview">

            <div id="selection-artwork">

                <img
                    id="selection-artwork-image"
                    alt=""
                >

            </div>

            <div id="selection-platform"></div>

            <div id="selection-title"></div>

            <div id="selection-description"></div>

            <div id="selection-status"></div>

        </section>


        <!--
            =================================================
            VERTICAL LAUNCHER
            =================================================
        -->

        <section
            id="item-area"
        >

            <div id="items"></div>

        </section>


        <!--
            =================================================
            OPTIONS MENU
            =================================================
        -->

        <section
            id="action-area"
        >

            <div
                id="action-title"
            >
                OPTIONS
            </div>

            <div id="actions"></div>

        </section>


        <!--
            =================================================
            SPOTIFY / MEDIA PLAYER
            =================================================
        -->

        <section
            id="media-player"
        >

            <div id="media-artwork">

                <img
                    id="media-artwork-image"
                    alt=""
                >

            </div>


            <div id="media-info">

                <div id="media-label">
                    NOW PLAYING
                </div>

                <div id="media-title">
                    Nothing playing
                </div>

                <div id="media-artist">
                    No active media
                </div>


                <div id="media-progress">

                    <div
                        id="media-progress-track"
                    >

                        <div
                            id="media-progress-fill"
                        ></div>

                    </div>

                </div>


                <div id="media-times">

                    <span id="media-current">
                        0:00
                    </span>

                    <span id="media-duration">
                        0:00
                    </span>

                </div>


                <div id="media-controls">

                    <button id="media-shuffle" type="button" title="Shuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3c3.5 0 4.5 10 8 10h3"></path><path d="M17 14l3 3-3 3"></path><path d="M3 17h3c1.2 0 2.2-1.1 3-2.5"></path><path d="M15 7h2c1.2 0 2.2 1.1 3 2.5"></path><path d="M17 4l3 3-3 3"></path></svg></button>

                    <button id="media-repeat" type="button" title="Repeat" aria-label="Repeat off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 6h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 18H7"></path></svg></button>

                    <button
                        id="media-previous"
                        type="button"
                    >
                        ◀
                    </button>

                    <button
                        id="media-play"
                        type="button"
                    >
                        ▶
                    </button>

                    <button
                        id="media-next"
                        type="button"
                    >
                        ▶
                    </button>

                </div>

            </div>

        </section>


    </main>


    <!--
        ====================================================
        TEMPORARY MESSAGE
        ====================================================
    -->

    <div
        id="temporary-message"
    ></div>


    <!--
        ====================================================
        BOTTOM CONTROLS
        ====================================================
    -->

    <footer id="bottom-bar">

        <div id="input-mode">
            KEYBOARD
        </div>


        <div
            id="control-hints"
        >

            <div id="back-hint">

                <span
                    id="back-button"
                    class="input-button"
                >
                    ESC
                </span>

                <span id="back-label">
                    Back
                </span>

            </div>


            <div id="options-hint">

                <span
                    id="options-button"
                    class="input-button"
                >
                    O
                </span>

                <span id="options-label">
                    Options
                </span>

            </div>


            <div
                id="friends-platform-hint"
                aria-hidden="true"
            >
                <span class="input-button">LB</span>
                <span class="friends-platform-hint-arrow">/</span>
                <span class="input-button">RB</span>
                <span>Platforms</span>
            </div>

            <div
                id="spotify-controller-hint"
                aria-hidden="true"
            >
                <span class="input-button">LB+RB</span>
                <span>Media</span>
            </div>

            <div id="select-hint">

                <span
                    id="select-button"
                    class="input-button"
                >
                    ENTER
                </span>

                <span id="select-label">
                    Select
                </span>

            </div>

        </div>

    </footer>


    <!--
        ====================================================
        JAVASCRIPT
        ====================================================
    -->

    <script src="components/categoryBar.js"></script>

    <script src="components/itemList.js"></script>

    <script src="components/statusPanel.js"></script>


    <!-- Existing services -->

    <script src="../services/steam.js"></script>

    <script src="../services/riot.js"></script>

    <script src="../services/spotify.js"></script>

    <script src="../services/server.js"></script>


    <!-- Metadata -->

    <script src="../services/metadata.js"></script>

    <script src="../services/steamMetadata.js"></script>

    <script src="../services/steamArtwork.js"></script>

    <script src="../services/artwork.js"></script>


    <!-- XMB logic -->

    <script src="js/navigation.js"></script>

    <script src="js/controller.js"></script>

    <script src="js/audio.js"></script>

    <script src="js/settings.js"></script>

    <script src="js/renderer.js"></script>

    <script src="js/clock.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
