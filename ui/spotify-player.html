<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Personal XMB Spotify Engine</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#05070a;color:#fff;font-family:Segoe UI,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#status{padding:18px 24px;text-align:center;opacity:.92}
button{margin-top:10px;padding:8px 18px}
.hidden{display:none}
</style>
</head>
<body>
<div id="status">
<strong>Personal XMB Spotify Engine</strong>
<div id="message">Starting Spotify audio...</div>
<button id="activate" class="hidden">Activate Spotify Audio</button>
</div>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
(() => {
const key = new URLSearchParams(location.search).get("key");
const status = document.getElementById("message");
const activate = document.getElementById("activate");
let player = null;

async function report(path, body) {
try {
await fetch(path + "?key=" + encodeURIComponent(key), {
method: body ? "POST" : "GET",
headers: body ? {"Content-Type":"application/json"} : {},
body: body ? JSON.stringify(body) : undefined
});
} catch {}
}

window.onSpotifyWebPlaybackSDKReady = async () => {
if (!window.Spotify) return;

player = new Spotify.Player({
name: "Personal XMB",
getOAuthToken: async cb => {
try {
const response = await fetch("/token?key=" + encodeURIComponent(key), {cache:"no-store"});
const data = await response.json();
if (!data.success) throw new Error(data.error || "Spotify token unavailable.");
cb(data.accessToken);
} catch (error) {
status.textContent = error.message;
await report("/error", {message:error.message});
}
},
volume: 0.75,
enableMediaSession: true
});

player.addListener("ready", async ({device_id}) => {
status.textContent = "Spotify audio engine ready.";
await report("/ready", {deviceId:device_id});
});

player.addListener("not_ready", async ({device_id}) => {
await report("/not-ready", {deviceId:device_id});
});

player.addListener("autoplay_failed", async () => {
status.textContent = "Click Activate Spotify Audio once.";
activate.classList.remove("hidden");
await report("/autoplay-failed", {});
});

for (const event of ["initialization_error","authentication_error","account_error","playback_error"]) {
player.addListener(event, async ({message}) => {
status.textContent = message || "Spotify playback failed.";
await report("/error", {message});
});
}

player.addListener("player_state_changed", async state => {
if (!state) return;
await report("/state", {
paused: !!state.paused,
position: state.position || 0,
duration: state.duration || 0
});
});

const connected = await player.connect();
if (!connected) {
status.textContent = "Spotify player could not connect.";
return;
}

try { await player.activateElement(); } catch {}
};

activate.addEventListener("click", async () => {
if (!player) return;
try {
await player.activateElement();
activate.classList.add("hidden");
status.textContent = "Spotify audio activated.";
} catch (error) {
status.textContent = error.message || "Unable to activate Spotify audio.";
}
});
})();
</script>
</body>
</html>
